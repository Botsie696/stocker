<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Sign in — Portfolio Rebalancer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-slate-900 rounded-xl p-6 border border-slate-800">
    <h1 class="text-lg font-semibold mb-1">Portfolio Rebalancer</h1>
    <p class="text-slate-400 text-sm mb-5">Enter the app password to continue.</p>
    {% if error %}
    <div class="bg-red-950/60 border border-red-800 text-red-300 text-sm rounded-lg p-3 mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <input type="password" name="password" autofocus placeholder="Password"
             class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-3 text-base focus:outline-none focus:border-indigo-500">
      <button type="submit" class="w-full px-4 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-medium">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
